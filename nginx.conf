server {
  listen 3000;
  root /usr/share/nginx/html;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript image/svg+xml;

  # Old URLs: the typo'd slug, date-prefixed slugs, and /posts/<slug> → /p/<slug>.
  location = /posts/relocating-denark { return 301 /p/relocating-denmark; }
  location ~ ^/(?:p|posts)/\d{4}-\d{2}-\d{2}-([^/]+?)/?$ { return 301 /p/$1; }
  location ~ ^/posts/([^/]+?)/?$ { return 301 /p/$1; }

  location /images/ { expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ =404; }
  error_page 404 /404/index.html;
}
